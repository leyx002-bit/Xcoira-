/**
 * XCOIRA \u2014 game top-up & airtime vending app. FRONTEND ONLY.
 * Structure: Home / Game / Bills / My, with login/register,
 * game orders paid by bank transfer, and selling airtime for a bank payout.
 *
 * Backend: Supabase (auth + Postgres with Row Level Security). Run
 * schema.sql once in the Supabase SQL Editor. You mark orders Delivered /
 * airtime sales Paid by editing the status in the Supabase Table Editor;
 * the customer is notified automatically.
 *
 * EVERYTHING IS MANUAL, through Telegram:
 *  - Game orders: customer pays your bank account (BANK_* below), you get
 *    a Telegram alert, confirm the money, then top up the game.
 *  - Airtime sales: customer sends airtime, fills in their bank details,
 *    you get a Telegram alert, verify the airtime, then pay them by
 *    bank transfer.
 *
 */

// ---------- PAYMENT: YOUR BANK DETAILS ----------
// Customers pay game orders by bank transfer to this account, using the
// order reference as the transfer narration. You see the Telegram alert,
// confirm the money in your bank app, then top up the game.
const BANK_NAME = "ACCESS BANK ";
const BANK_ACCOUNT_NUMBER = "1932341962";
const BANK_ACCOUNT_NAME = "IFEANYI STANLEY CHINONSO";

// Short, easy-to-type reference for an order (shown to the customer and
// included in the Telegram alert so you can match the transfer).
function orderRef(order) {
  return String(order.id).slice(-6).toUpperCase();
}

// ---------- TELEGRAM BOT NOTIFICATIONS ----------
// Game orders and "sell airtime" submissions are sent to YOUR Telegram bot
// so you can execute them by hand. Fill these in:
//   TELEGRAM_BOT_TOKEN: from @BotFather (looks like 123456:ABC-DEF...)
//   TELEGRAM_CHAT_ID:   your chat/group id. Message your bot, then open
//                       https://api.telegram.org/bot<TOKEN>/getUpdates
//                       and copy chat.id (groups start with -100).
// WARNING: anything in this file is public. Anyone who views the page
// source can read the token. Use a separate notify-only bot (not one
// that holds anything valuable) and revoke it in @BotFather if abused.
// When you add a backend, move this call there and delete the token here.
const TELEGRAM_BOT_TOKEN = "";
const TELEGRAM_CHAT_ID = "";

// Returns true if Telegram accepted the message.
async function notifyTelegram(text) {
  if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return false;
  try {
    const res = await fetch("https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendMessage", {
      method: "POST",
      // form-encoded keeps this a "simple" request (no CORS preflight)
      body: new URLSearchParams({ chat_id: TELEGRAM_CHAT_ID, text }),
    });
    const data = await res.json();
    return !!data.ok;
  } catch (e) {
    return false;
  }
}

// ---------- SUPABASE BACKEND ----------
// The URL and publishable key are safe to ship in the page: what users
// can do is limited by the Row Level Security rules in schema.sql.
// NEVER put the secret/service_role key or the database password here.
const SUPABASE_URL = "https://toxygeunxvdhnkajcfjf.supabase.co";
const SUPABASE_KEY = "sb_publishable_SVE8cPwk_lxRaW3ysm-swg_hmAhBA0w";
// Login is by phone number, but Supabase phone login needs a paid SMS
// provider. So each phone number is mapped to a hidden email for auth.
// (If Supabase rejects this domain, change it to any domain you own.)
const AUTH_DOMAIN = "xcoira.app";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function fail(message) { return { error: { message } }; }
function authEmail(phone) { return "p" + phone + "@" + AUTH_DOMAIN; }

const mapOrder = (r) => ({
  id: r.id, kind: r.kind, productName: r.product_name, tierLabel: r.tier_label,
  detail: r.detail, price: r.price, status: r.status, boughtAt: r.bought_at,
});
const mapSale = (r) => ({
  id: r.id, network: r.network, phone: r.phone, amount: r.amount, payout: r.payout,
  status: r.status, at: r.created_at, bankName: r.bank_name,
  accountNumber: r.account_number, accountName: r.account_name,
});
const mapNote = (r) => ({ id: r.id, text: r.text, at: r.created_at, read: r.is_read });

const api = {
  async register(phone, password, email) {
    const { data, error } = await sb.auth.signUp({
      email: authEmail(phone), password,
      options: { data: { phone, email } },
    });
    if (error) {
      if (/already registered/i.test(error.message)) return fail("An account with this phone number already exists.");
      return fail(error.message);
    }
    if (!data.session) return fail("Sign-up needs email confirmation turned off in Supabase (Authentication > Sign In / Providers > Email).");
    return { user: { id: data.user.id, email } };
  },
  async login(phone, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email: authEmail(phone), password });
    if (error) return fail("Incorrect phone number or password.");
    return { user: { id: data.user.id, email: "" } };
  },
  async logout() { await sb.auth.signOut(); },

  async fetchFullState(userId) {
    const [p, o, a, n] = await Promise.all([
      sb.from("profiles").select("*").eq("id", userId).maybeSingle(),
      sb.from("purchases").select("*").order("bought_at", { ascending: true }),
      sb.from("airtime_sales").select("*").order("created_at", { ascending: true }),
      sb.from("notifications").select("*").order("created_at", { ascending: true }),
    ]);
    if (p.error || !p.data || o.error || a.error || n.error) return null;
    return {
      authed: true,
      isAdmin: false,
      userId,
      profile: { name: p.data.name || "", email: p.data.email || "", phone: p.data.phone || "" },
      notifications: n.data.map(mapNote),
      purchases: o.data.map(mapOrder),
      airtimeSales: a.data.map(mapSale),
    };
  },

  async updateProfile(userId, name, email) {
    const { error } = await sb.from("profiles").update({ name, email }).eq("id", userId);
    return error ? fail(error.message) : {};
  },

  async applyPurchase(userId, kind, productName, tierLabel, detail, price) {
    if (!(price > 0)) return fail("Invalid price");
    const { data, error } = await sb.from("purchases")
      .insert({ kind, product_name: productName, tier_label: tierLabel, detail, price })
      .select().single();
    return error ? fail(error.message) : { order: mapOrder(data) };
  },

  // Customer says they've sent the bank transfer. You still confirm it in
  // your bank app before delivering.
  async markPaymentSent(userId, orderId) {
    const { data, error } = await sb.rpc("mark_payment_sent", { p_order_id: orderId });
    return error ? fail(error.message) : { order: mapOrder(data) };
  },

  async submitAirtimeSale(userId, network, phone, amount, bank) {
    if (!(amount >= AIRTIME_MIN)) return fail("Minimum is \u20A6" + AIRTIME_MIN);
    if (!bank || !bank.bankName || !bank.accountNumber || !bank.accountName) return fail("Enter your bank details");
    const { data, error } = await sb.from("airtime_sales").insert({
      network, phone, amount,
      bank_name: bank.bankName, account_number: bank.accountNumber, account_name: bank.accountName,
    }).select().single();
    return error ? fail(error.message) : { sale: mapSale(data) };
  },

  async markAllRead(userId) {
    await sb.from("notifications").update({ is_read: true }).eq("user_id", userId).eq("is_read", false);
  },
};

// ---------- app state ----------
// Reads the signed-in user's data through the api layer above.
function fetchFullState(userId) {
  return api.fetchFullState(userId);
}

function defaultState() {
  return {
    authed: false,
    isAdmin: false,
    userId: null,
    profile: { name: "", email: "", phone: "" }, // editable from the Personal screen
    notifications: [], // auto-generated app events, shown on the Messages screen
    purchases: [],      // completed orders: game top-ups
    airtimeSales: [],     // sell-airtime requests: { id, network, phone, amount, payout, status, at }
  };
}

function hydrate(saved) {
  const base = defaultState();
  if (!saved) return base;
  return { ...base, ...saved };
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Short, stable display ID shown on the My page — derived from the
// user's phone number so it doesn't need a server-issued account id.
function accountDisplayId(phone) {
  const digits = (phone || "").replace(/\D/g, "");
  return digits ? digits.slice(-8) : "\u2014";
}

function nowISO() {
  return new Date().toISOString();
}

function fmtDateLong(d) {
  return d.toLocaleDateString("en-NG", { day: "numeric", month: "long", year: "numeric" });
}

// ---------- SELL AIRTIME ----------
// The user sends real airtime to our collection number for their
// network, then submits this form with their bank details. We can't
// verify from the browser that the airtime arrived, so it's a "Pending
// review" request: you get a Telegram alert, check the airtime landed,
// then pay them by bank transfer.
// Drop a file named airtime-banner.png next to this HTML file to show
// a real photo here; missing file falls back to the phone icon.
const AIRTIME_SELL_BANNER = ["airtime-banner.png"];

function SellAirtimePage({ onBack, onSubmit }) {
  const [network, setNetwork] = useState(AIRTIME_NETWORKS[0].id);
  const [phone, setPhone] = useState("");
  const [raw, setRaw] = useState("");
  const [confirmed, setConfirmed] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [bankName, setBankName] = useState("");
  const [accountNumber, setAccountNumber] = useState("");
  const [accountName, setAccountName] = useState("");

  const numeric = Number(raw) || 0;
  const tooLow = raw !== "" && numeric > 0 && numeric < AIRTIME_MIN;
  const phoneValid = phone.trim().length >= 10;
  const payout = Math.round(numeric * AIRTIME_SELL_RATE);
  const bankValid = bankName.trim().length >= 2 && /^\d{10}$/.test(accountNumber) && accountName.trim().length >= 3;
  const canSubmit = numeric >= AIRTIME_MIN && phoneValid && bankValid && confirmed;
  const activeNetwork = AIRTIME_NETWORKS.find(n => n.id === network);

  function handleAmountChange(v) {
    setRaw(v.replace(/[^0-9]/g, ""));
  }

  function copyCollectionNumber() {
    try { navigator.clipboard.writeText(activeNetwork.collectionNumber); } catch (e) {}
  }

  function submit() {
    if (!canSubmit) return;
    onSubmit(network, phone.trim(), numeric, payout, {
      bankName: bankName.trim(), accountNumber, accountName: accountName.trim(),
    });
    setSubmitted(true);
  }

  if (submitted) {
    return (
      <div>
        <TopBar title="Sell Airtime" onBack={onBack} />
        <div style={{ padding: "50px 24px", textAlign: "center" }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
            <IconBadge name="clock" size={52} iconSize={24} />
          </div>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 17, color: C.ink, marginBottom: 10 }}>
            Request submitted
          </div>
          <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.6 }}>
            We're confirming the {fmt(numeric)} airtime landed on {activeNetwork.collectionNumber}.
            Once verified, {fmt(payout)} is sent to your {bankName.trim()} account ({accountNumber}). Check Airtime Sale Record for status.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <TopBar title="Sell Airtime" onBack={onBack} />
      <div style={{
        height: 130, position: "relative", overflow: "hidden",
        background: `linear-gradient(120deg, ${C.forestDeep}, ${C.forest})`,
      }}>
        <ImageSlide images={AIRTIME_SELL_BANNER} cover fallbackIcon="phone" />
      </div>
      <div style={{ padding: 18 }}>
        <label style={{ fontSize: 11, color: C.inkSoft }}>Network</label>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 6, marginBottom: 18 }}>
          {AIRTIME_NETWORKS.map(n => (
            <button key={n.id} onClick={() => setNetwork(n.id)} style={{
              padding: "12px 0", borderRadius: 10, cursor: "pointer", fontWeight: 700, fontSize: 13,
              border: network === n.id ? `2px solid ${C.forest}` : `1px solid ${C.line}`,
              background: network === n.id ? C.cream : C.paper, color: C.forest,
            }}>{n.name}</button>
          ))}
        </div>

        <div style={{
          background: C.cream, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 15px", marginBottom: 18,
        }}>
          <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 6 }}>Send your {activeNetwork.name} airtime to</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontFamily: "Georgia, serif", fontSize: 18, color: C.ink }}>{activeNetwork.collectionNumber}</span>
            <button onClick={copyCollectionNumber} style={{
              border: `1px solid ${C.line}`, background: C.paper, borderRadius: 8, padding: "7px 12px",
              fontSize: 11.5, fontWeight: 700, color: C.forest, cursor: "pointer",
            }}>Copy</button>
          </div>
        </div>

// ---------- PHOTO SLIDESHOW (reusable) ----------
// Cycles through whatever image filenames are passed in, wherever a
// brand mark or game banner would otherwise be a plain icon/gradient.
// Any filename that 404s is skipped silently and never retried, so
// dropping in 1, 2, or 3 real photos just works — no placeholders
// needed for the rest. Falls back to an icon if none of the images
// are present yet.
function ImageSlide({ images, size = 64, intervalMs = 5000, cover = false, fallbackIcon = "leaf" }) {
  const [index, setIndex] = useState(0);
  const [failedAll, setFailedAll] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const failedSet = React.useRef(new Set());

  React.useEffect(() => {
    if (failedAll || images.length <= 1) return;
    const t = setInterval(() => {
      setIndex(i => {
        let next = (i + 1) % images.length;
        // skip over any slide already known to be missing
        let tries = 0;
        while (failedSet.current.has(next) && tries < images.length) {
          next = (next + 1) % images.length;
          tries++;
        }
        return next;
      });
    }, intervalMs);
    return () => clearInterval(t);
  }, [failedAll, intervalMs, images]);

  // Auto-return to the slideshow 10 seconds after opening fullscreen.
  React.useEffect(() => {
    if (!fullscreen) return;
    const t = setTimeout(() => setFullscreen(false), 10000);
    return () => clearTimeout(t);
  }, [fullscreen]);

  function handleError() {
    failedSet.current.add(index);
    if (failedSet.current.size >= images.length) {
      setFailedAll(true);
      return;
    }
    setIndex(i => (i + 1) % images.length);
  }

  if (!images.length || failedAll) {
    return <Icon name={fallbackIcon} size={size * 0.75} color={C.cream} strokeWidth={1.3} />;
  }

  const imgEl = (
    <img
      key={images[index]}
      src={images[index]}
      alt=""
      onError={handleError}
      onClick={cover ? () => setFullscreen(true) : undefined}
      style={cover
        ? { width: "100%", height: "100%", objectFit: "cover", cursor: "pointer" }
        : { width: size, height: size, objectFit: "contain", borderRadius: size * 0.18 }}
    />
  );

  if (!fullscreen) return imgEl;

  return (
    <div onClick={() => setFullscreen(false)} style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.92)", zIndex: 999,
      display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
    }}>
      <img src={images[index]} alt="" style={{ maxWidth: "92%", maxHeight: "80%", objectFit: "contain" }} />
    </div>
  );
}

// Brand-mark image — used on the Auth (login/register) header banner.
// Drop a file named image.png next to this HTML file and it appears

const LOGO_SLIDES = ["image.png"];

function LogoSlide({ size = 64, intervalMs = 5000, cover = false }) {

// ---------- CAPTCHA ----------
// A drawn, scrambled-character challenge \u2014 the person must type what
// they see before registering. This is a basic bot deterrent, not real
// security (anyone reading the page source can see the answer in
// React state) \u2014 it stops simple automated signup spam, not a
// determined attacker. Canvas-drawn so the code can't be selected/
// copy-pasted as plain text the way a plain <div> of characters could be.
const CAPTCHA_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to avoid confusion

function generateCaptchaCode(length = 5) {
  let code = "";
  for (let i = 0; i < length; i++) {
    code += CAPTCHA_CHARS[Math.floor(Math.random() * CAPTCHA_CHARS.length)];
  }
  return code;
}

function Captcha({ code, onRefresh }) {
  const canvasRef = React.useRef(null);

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#F6F2EA";
    ctx.fillRect(0, 0, w, h);

    // noise lines
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(27, 58, 43, ${0.12 + Math.random() * 0.15})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.random() * w, Math.random() * h);
      ctx.lineTo(Math.random() * w, Math.random() * h);
      ctx.stroke();
    }

    // scattered dots
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `rgba(107, 107, 99, ${0.15 + Math.random() * 0.2})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    // each character, rotated and offset a bit
    const charWidth = w / code.length;
    for (let i = 0; i < code.length; i++) {
      ctx.save();
      const cx = charWidth * i + charWidth / 2;
      const cy = h / 2 + (Math.random() * 10 - 5);
      ctx.translate(cx, cy);
      ctx.rotate((Math.random() * 0.5 - 0.25));
      ctx.font = "bold 26px Georgia, serif";
      ctx.fillStyle = ["#1B3A2B", "#11271C", "#C9703D"][i % 3];
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(code[i], 0, 0);
      ctx.restore();
    }
  }, [code]);

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
      <canvas ref={canvasRef} width={160} height={50} style={{
        borderRadius: 8, border: `1px solid ${C.line}`, display: "block",
      }} />
      <button type="button" onClick={onRefresh} style={{
        border: `1px solid ${C.line}`, background: C.paper, borderRadius: 8,
        width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "pointer", flexShrink: 0,
      }} aria-label="Refresh captcha">
        <Icon name="refresh" size={16} color={C.inkSoft} />
      </button>
    </div>
  );
}

// Login is by phone number. See api.register / api.login above.
function normalizePhone(phone) {
  return phone.replace(/\D/g, "");
}

// General international phone check (not Nigeria-specific): after
// stripping everything but digits, a real phone number is 7\u201315 digits
// long \u2014 the E.164 range every country's numbers fall within.
function isValidPhone(normPhone) {
  return /^\d{7,15}$/.test(normPhone);
}

async function registerAccount(phone, password, email) {
  const normPhone = normalizePhone(phone);
  const cleanEmail = (email || "").trim();
  const res = await api.register(normPhone, password, cleanEmail);
  if (res.error) return { ok: false, error: res.error.message };
  return { ok: true, account: { phone: normPhone, email: cleanEmail } };
}

async function checkLogin(phone, password) {
  const normPhone = normalizePhone(phone);
  const res = await api.login(normPhone, password);
  if (res.error) return { ok: false, error: res.error.message };
  return { ok: true, account: { phone: normPhone, email: "" } };
}

}


function Auth({ mode, setMode, onLogin }) {
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [captchaCode, setCaptchaCode] = useState(() => generateCaptchaCode());
  const [captchaInput, setCaptchaInput] = useState("");
  const [error, setError] = useState("");

  function refreshCaptcha() {
    setCaptchaCode(generateCaptchaCode());
    setCaptchaInput("");
  }

  function resetFormError() {
    if (error) setError("");
  }

  async function submit() {
    const normPhone = normalizePhone(phone);
    if (!isValidPhone(normPhone)) {
      setError("Enter a valid phone number.");
      return;
    }
    if (mode === "register" && !/^\S+@\S+\.\S+$/.test(email.trim())) {
      setError("Enter a valid email address.");
      return;
    }
    if (password.length < 6) {
      setError("Password must be at least 6 characters.");
      return;
    }
    if (mode === "register" && captchaInput.trim().toUpperCase() !== captchaCode) {
      setError("The code you entered doesn\u2019t match the image.");
      refreshCaptcha();
      return;
    }

    setError("");
    if (mode === "register") {
      const result = await registerAccount(phone, password, email.trim());
      if (!result.ok) {
        setError(result.error);
        refreshCaptcha();
        return;
      }
      onLogin();
    } else {
      const result = await checkLogin(phone, password);
      if (!result.ok) {
        setError(result.error);
        refreshCaptcha();
        return;
      }
      onLogin();
    }
  }

  return (
    <div style={{ minHeight: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{
        height: 190, background: `linear-gradient(125deg, ${C.forestDeep}, ${C.forest})`,
        display: "flex", alignItems: "center", justifyContent: "center", position: "relative",
        overflow: "hidden",
      }}>
        <div style={{ position: "absolute", inset: 0 }}>
          <LogoSlide cover />
        </div>
        <div style={{
          position: "absolute", inset: 0,
          background: "linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.25) 100%)",
        }} />
        <div style={{
          position: "absolute", left: 18, top: 16, color: C.cream, fontFamily: "Georgia, serif",
          fontSize: 18, letterSpacing: 0.5,
        }}>Xcoira</div>
      </div>
      {!STORAGE_OK && (
        <div style={{ background: "#FBEAE7", color: "#B8392A", fontSize: 12, padding: "10px 18px", lineHeight: 1.5 }}>
          This browser is blocking saved logins. You can still sign in, but your account is only kept until you close or reload the page. Open the app in Chrome to keep it.
        </div>
      )}
      <div style={{ flex: 1, padding: "28px 22px", background: C.cream }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 22, color: C.ink, marginBottom: 18 }}>
          {mode === "login" ? "Welcome back" : "Create your account"}
        </div>
        <div style={{ position: "relative", marginBottom: 12 }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: C.inkSoft }}>
            <Icon name="phone" size={17} />
          </span>
          <input value={phone} onChange={e => { setPhone(e.target.value); resetFormError(); }}
            placeholder="" inputMode="tel"
            style={{ ...inputStyle, paddingLeft: 40, marginBottom: 0 }} />
        </div>
        {mode === "register" && (
          <div style={{ position: "relative", marginBottom: 12, marginTop: 12 }}>
            <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: C.inkSoft }}>
              <Icon name="mail" size={16} />
            </span>
            <input value={email} onChange={e => { setEmail(e.target.value); resetFormError(); }}
              placeholder="" type="email" inputMode="email"
              style={{ ...inputStyle, paddingLeft: 40, marginBottom: 0 }} />
          </div>
        )}
        <div style={{ position: "relative", marginBottom: 12, marginTop: 12 }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", color: C.inkSoft }}>
            <Icon name="lock" size={17} />
          </span>
          <input value={password} onChange={e => { setPassword(e.target.value); resetFormError(); }}
            placeholder="" type="password" style={{ ...inputStyle, paddingLeft: 40, marginBottom: 0 }} />
        </div>
        {mode === "register" && (
          <div style={{ marginTop: 16 }}>
            <label style={{ fontSize: 11, color: C.inkSoft, display: "block", marginBottom: 6 }}>
              Type the code shown below
            </label>
            <Captcha code={captchaCode} onRefresh={refreshCaptcha} />
            <input value={captchaInput} onChange={e => { setCaptchaInput(e.target.value); resetFormError(); }}
              placeholder="" style={{ ...inputStyle, marginBottom: 0, letterSpacing: 2 }} />
          </div>
        )}
        {error && (
          <div style={{ color: "#B8392A", fontSize: 12.5, marginTop: 10, lineHeight: 1.4 }}>{error}</div>
        )}
        <button onClick={submit} style={{
          width: "100%", padding: "15px 0", borderRadius: 12, border: "none",

  return (
    <div>
      <TopBar title={title} onBack={onBack} />
      {rows.length === 0 ? (
        <div style={{ padding: "40px 24px", color: C.inkSoft, fontSize: 13, textAlign: "center" }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
            <IconBadge name={icon} size={52} iconSize={24} />
          </div>
          {emptyText}
        </div>
      ) : (
        <div style={{ padding: 14 }}>
          {rows.slice().reverse().map(r => renderRow(r))}
        </div>
      )}
    </div>
  );
}

function recordRowStyle() {
  return {
    background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12,
    padding: "13px 15px", marginBottom: 10,
  };
}

function fmtWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-NG", { day: "2-digit", month: "short", year: "numeric" }) +
    " \u00b7 " + d.toLocaleTimeString("en-NG", { hour: "2-digit", minute: "2-digit" });
}

// ---------- APP ROOT ----------
function TopMe() {
  const [store, setStore] = useState(() => defaultState());
  const [checkingSession, setCheckingSession] = useState(true);
  const [authMode, setAuthMode] = useState("login");
  const [tab, setTab] = useState("home");
  const [screen, setScreen] = useState(null);
  const [activeGame, setActiveGame] = useState(null);
  const [activePackage, setActivePackage] = useState(null);
  const [toast, setToast] = useState(null);
  const [confirmingLogout, setConfirmingLogout] = useState(false);
  const [payOrderId, setPayOrderId] = useState(null);

  // Reloads wallet/orders/notifications from the api layer and replaces
  // local state with it. Called after login and after every action that
  // changes data so the UI always reflects what's stored.
  async function refreshFromServer() {
    const session = await getCurrentSession();
    if (!session) {
      setStore(defaultState());
      return;
    }
    const fresh = await fetchFullState(session.user.id);
    if (fresh) setStore(fresh);
  }

  // On first load, restore an existing session (e.g. after a page
  // refresh) instead of dropping back to the login screen.
  React.useEffect(() => {
    refreshFromServer().finally(() => setCheckingSession(false));
  }, []);

  // While logged in, poll every 20s so changes made elsewhere (another
  // tab, TopMeDev, or later a real backend) show up without a re-login.
  React.useEffect(() => {
    if (!store.authed) return;
    const interval = setInterval(refreshFromServer, 20000);
    return () => clearInterval(interval);
  }, [store.authed]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  function openGame(g) { setActiveGame(g); setScreen("game"); }
  function selectPackage(pkg) { setActivePackage(pkg); setScreen("gameOrder"); }

  // Every balance-changing action below goes through the api layer, then
  // we re-pull fresh state. With a real backend this is what keeps users
  // from setting their own balance (here they can \u2014 it is local).
  const placingRef = React.useRef(false);

  async function confirmGamePurchase(action, playerId, zoneId) {
    if (placingRef.current) return;   // ignore double taps while an order is being placed
    placingRef.current = true;
    try {
      const detail = zoneId ? `ID ${playerId} \u00b7 Zone ${zoneId}` : `ID ${playerId}`;
      const { error, order } = await api.applyPurchase(store.userId, "game", activeGame.name, activePackage.label,
        detail, activePackage.price);
      if (error) { showToast(error.message || "Purchase failed"); return; }
      await refreshFromServer();
      // Pop the bank details up over the order screen straight away.
      if (order) setPayOrderId(order.id);
      // Then alert your Telegram bot (manual execution once payment lands).
      const sent = order ? await notifyTelegram(gameOrderMessage(order, store.profile?.phone)) : false;
      if (TELEGRAM_BOT_TOKEN && !sent) {
        showToast("Order saved, but we couldn't alert support \u2014 please message us after paying");
      }
    } finally {
      placingRef.current = false;
    }
  }

  // Closes the payment popup. If it was opened right after placing an
  // order, leave the order screen and show the order in Purchase History.
  function closePay() {
    setPayOrderId(null);
    if (screen === "gameOrder") {
      setActiveGame(null);
      setActivePackage(null);
      setScreen("purchaseHistory");
    }
  }

  // Customer taps "I've made the payment": alert you on Telegram.
  async function claimPayment(orderId) {
    const { error, order } = await api.markPaymentSent(store.userId, orderId);
    if (error) { showToast(error.message || "Couldn't update order"); return; }
    const sent = order ? await notifyTelegram(paymentClaimedMessage(order, store.profile?.phone)) : false;
    await refreshFromServer();
    showToast(TELEGRAM_BOT_TOKEN && !sent
      ? "Saved, but we couldn't alert support \u2014 please message us to confirm"
      : "Thanks! We'll deliver once your payment is confirmed.");
    setPayOrderId(null);
    setActiveGame(null);
    setActivePackage(null);
    setScreen("purchaseHistory");
  }

  // Submits a sell-airtime claim as "Pending review" \u2014 does NOT touch
  // the wallet. Airtime can't be verified from the browser, so it is
  // never credited instantly; a trusted person/backend marks it Paid
  // (you set it to Paid in the Supabase Table Editor).
  async function submitAirtimeSale(networkId, phone, amount, payout, bank) {
    const network = AIRTIME_NETWORKS.find(n => n.id === networkId);
    const { error, sale } = await api.submitAirtimeSale(store.userId, network.name, phone, amount, bank);
    if (error) { showToast(error.message || "Couldn't submit \u2014 try again"); return; }
    const sent = sale ? await notifyTelegram(airtimeSaleMessage(sale, store.profile?.phone)) : false;
    await refreshFromServer();
    if (TELEGRAM_BOT_TOKEN && !sent) {
      showToast("Request saved, but we couldn't reach support \u2014 please contact us to confirm");
    }
  }

  function handleNav(to) {
    if (to === "logout") { setConfirmingLogout(true); return; }
    setScreen(to);
  }

  if (checkingSession) {
    return <Shell><div style={{ flex: 1 }} /></Shell>;
  }

  if (!store.authed) {
    return (
      <Shell>
        <Auth mode={authMode} setMode={setAuthMode} onLogin={refreshFromServer} />
      </Shell>
    );
  }

  let body;
  if (confirmingLogout) {
    body = (
      <div style={{ padding: 24 }}>
        <TopBar title="Log out" onBack={() => setConfirmingLogout(false)} />
        <div style={{ padding: "30px 4px", textAlign: "center" }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
            <IconBadge name="power" size={52} iconSize={24} bg="#FBEAE7" fg="#B8392A" />
          </div>
          <div style={{ fontFamily: "Georgia, serif", fontSize: 17, color: C.ink, marginBottom: 22 }}>
            Log out of Xcoira?
          </div>
          <button onClick={async () => { await signOutAccount(); setStore(defaultState()); setConfirmingLogout(false); setScreen(null); setTab("home"); }} style={{
            width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
            background: "#B8392A", color: C.cream, fontSize: 15, fontWeight: 700, cursor: "pointer", marginBottom: 10,
          }}>Log out</button>
          <button onClick={() => setConfirmingLogout(false)} style={{
            width: "100%", padding: "14px 0", borderRadius: 12, border: `1px solid ${C.line}`,
            background: "none", color: C.ink, fontSize: 15, fontWeight: 600, cursor: "pointer",
          }}>Cancel</button>
        </div>
      </div>
    );
  } else if (screen === "game") {
    body = <GameDetail game={activeGame} onBack={() => setScreen(null)} onSelectPackage={selectPackage} />;
  } else if (screen === "gameOrder") {
    body = <GameOrder game={activeGame} pkg={activePackage}
      onBack={() => setScreen("game")} onConfirm={confirmGamePurchase} />;
  } else if (screen === "airtime") {
    body = <SellAirtimePage onBack={() => setScreen(null)} onSubmit={submitAirtimeSale} />;
  } else if (screen === "purchaseHistory") {
    body = <RecordList title="Purchase History" icon="history" onBack={() => setScreen(null)}
      rows={store.purchases} emptyText="No orders yet."
      renderRow={r => (
        <div key={r.id} style={recordRowStyle()}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: 14, color: C.ink }}>{r.productName} &middot; {r.tierLabel}</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: C.forest }}>{fmt(r.price)}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
            <span style={{ fontSize: 11.5, color: C.inkSoft }}>{r.detail}</span>
            <span style={{ fontSize: 11.5, color: C.inkSoft }}>{fmtWhen(r.boughtAt)}</span>
          </div>
          {r.kind === "game" && r.status && (
            <div style={{ marginTop: 4 }}>
              <span style={{
                fontSize: 11, fontWeight: 600,
                color: r.status === "Delivered" ? C.forest : C.clay,
              }}>{r.status}</span>
              {r.status === "Awaiting payment" && (
                <button onClick={() => setPayOrderId(r.id)} style={{
                  marginLeft: 12, background: "none", border: "none", padding: 0, cursor: "pointer",
                  fontSize: 11, fontWeight: 600, color: C.forest, textDecoration: "underline",
                }}>Pay now</button>
              )}
            </div>
          )}
        </div>
      )} />;
  } else if (screen === "airtimeSaleRecord") {
    body = <RecordList title="Airtime Sale Record" icon="doc" onBack={() => setScreen(null)}
      rows={store.airtimeSales} emptyText="No airtime sales yet."
      renderRow={r => (
        <div key={r.id} style={recordRowStyle()}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: 14, color: C.ink }}>{r.network} \u00b7 {r.phone}</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: r.status === "Paid" ? C.forest : C.inkSoft }}>{fmt(r.payout)}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
            <span style={{ fontSize: 11.5, color: C.inkSoft }}>{fmt(r.amount)} sold \u00b7 {fmtWhen(r.at)}</span>
            <span style={{ fontSize: 11, color: r.status === "Paid" ? C.forest : C.clay, fontWeight: 600 }}>{r.status}</span>
          </div>
        </div>
      )} />;
  } else if (screen === "personal") {
    body = <PersonalPage profile={store.profile} onBack={() => setScreen(null)}
      onSave={async (profile) => {
        // Phone is the login identifier, so it isn't editable here \u2014 only
        // name/email get persisted.
        const { error } = await api.updateProfile(store.userId, profile.name, profile.email);
        if (error) { showToast(error.message || "Couldn't save"); return; }
        await refreshFromServer();
        showToast("Personal details saved");
      }} />;
  } else if (screen === "message") {
    body = <MessagesPage notifications={store.notifications} onBack={() => setScreen(null)}
      onMarkAllRead={async () => {
        await api.markAllRead(store.userId);
        await refreshFromServer();
      }} />;
  } else if (screen === "about") {
    body = <AboutPage onBack={() => setScreen(null)} />;
  } else if (screen === "proof") {
    body = <ProofPage onBack={() => setScreen(null)} />;
  } else if (screen === "app") {
    body = <AppPage onBack={() => setScreen(null)} />;
  } else if (screen && SIMPLE_PAGES[screen]) {
    const pg = SIMPLE_PAGES[screen];
    body = <Simple title={pg.title} icon={pg.icon} onBack={() => setScreen(null)}>{pg.body}</Simple>;
  } else {
    if (tab === "home") body = <Home onNav={handleNav} onOpenGame={openGame} />;
    else if (tab === "game") body = <GamesTab onOpenGame={openGame} />;
    else if (tab === "bills") body = <BillsPage onNav={handleNav} />;
    else if (tab === "my") body = <MyPage userId={accountDisplayId(store.profile.phone)} phone={store.profile.phone || "Not set"} onNav={handleNav}
      unreadCount={store.notifications.filter(n => !n.read).length} />;
  }

  return (
    <Shell>
      <div style={{ flex: 1, overflowY: "auto", position: "relative" }}>
        {body}
        {toast && (
          <div style={{
            position: "absolute", left: 16, right: 16, bottom: 16, background: C.forestDeep,
            color: C.cream, padding: "12px 16px", borderRadius: 10, fontSize: 13, textAlign: "center",
            boxShadow: "0 8px 24px rgba(0,0,0,0.25)",
          }}>{toast}</div>
        )}
      </div>
      {!screen && !confirmingLogout && <BottomNav active={tab} onChange={setTab} />}
      {payOrderId && (
        <PayOrder order={store.purchases.find(x => x.id === payOrderId)} onBack={closePay} onClaim={claimPayment} />
      )}
    </Shell>
  );
}

function Shell({ children }) {
  return (
    <div style={{
      maxWidth: 420, margin: "0 auto", minHeight: "100vh", background: C.cream,
      fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
      display: "flex", flexDirection: "column", color: C.ink,
    }}>
      <StatusGlyph />
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TopMe />);
</script>
